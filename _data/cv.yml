        position: Machine Learning Researcher (Full-Time)
        location: Bangkok, Thailand
        start_date: 2025-09
        end_date: 2026-05
        summary: Developed advanced machine learning solutions for non-destructive testing applications under Prof. Cherdpong Jomdecha, focusing on acoustic emission sensor data analysis and anomaly detection.
        highlights:
          - "Journal Publication (co-author): Contributed MIECT probe development and signal processing for high-speed railway defect inspection - detecting cracks as small as 0.5 mm at speeds up to 30 km/h on ferromagnetic rail steel (published in Nondestructive Testing and Evaluation)"
          - "Production Pipeline Engineering: Architected and maintained scalable ETL pipelines in Python to process high-volume acoustic emission sensor data"
          - "Workflow Automation: Optimized end-to-end ML workflows, reducing data-processing latency and accelerating model-training lifecycles through automated scripting and rigorous version control"
          - "Model Reliability & Scalability: Engineered robust anomaly-detection systems for industrial pipe inspection, focusing on reproducibility and scalable deployment in Linux-based environments"
          - "Data Quality Assurance: Implemented automated validation within the data-ingestion pipeline to ensure high-fidelity input for unsupervised clustering models"

      - company: Maintenance Technology Center (MTC) - Non-Destructive Detection Technology Lab
        position: Machine Learning Intern
        location: Bangkok, Thailand
        start_date: 2025-06
        end_date: 2025-08
        summary: Independently designed and implemented unsupervised machine learning solutions for GRP pipe inspection using acoustic emission sensor data, demonstrating strong problem-solving and analytical skills in identifying patterns from complex, real-world infrastructure data on Linux based WSL2 platform with version control via Git.
        highlights:
          - "Won First Runner-Up Award in 'Smart Infrastructure for Smart City' competition by Metropolitan Waterworks Authority"
          - "Listed in KMUTT Hall of Fame for outstanding achievement in Smart Infrastructure development"
          - "Applied AI/ML techniques to solve real-world infrastructure challenges"

      - company: HoneyHunt.AI
        position: Junior Machine Learning Intern / Large Language Model Intern
        location: Bangkok, Thailand
        start_date: 2024-12
        end_date: 2025-02
        summary: Enhanced automated resume parsing and intelligent job matching systems by integrating AI APIs (advanced LLM APIs), improving accuracy and scalability.
        highlights:
          - "Improved algorithm scalability and matching accuracy for production-level deployment"
          - "Contributed to product development in AI-powered recruitment technology"
          - "Explored Generative AI techniques to design agentic workflows for automated data processing and decision-making, leveraging LLMs and prompt engineering to optimize AI-driven recruitment solutions"
          - "Implemented API management best practices including versioning, rate limiting, and authentication using API gateways to support reliable deployment of GenAI workflows in production environments"

    Research:
      - company: Department of Control Systems and Instrumentation (INC), KMUTT
        position: Computer Vision (Student) Researcher
        location: Bangkok, Thailand
        start_date: 2024-06
        end_date: 2025-09
        summary: Developed an optimized 3D-CNN for real-time infrared video classification achieving 99.75% accuracy in methane gas-leak detection from temporal-spatial thermal-camera features.
        highlights:
          - "Built a classical image-processing pipeline (Gaussian Mixture Models, Running Average, adaptive background subtraction) for robust foreground segmentation under varying lighting conditions"
          - "Optimized the model for edge deployment via input-resolution scaling and quantization, maintaining 99%+ accuracy while reducing inference time by 60%"
          - "First-authored the resulting study, awarded Best Paper at IEEE ICoICT 2025"

      - company: CODIA Lab, KMUTT & Panasonic Singapore
        position: Perception (Student) Research Engineer
        location: Bangkok, Thailand
        start_date: 2024-02
        end_date: 2024-07
        summary: Developed and optimized SLAM Sparse Bundle Adjustment algorithms in C for visual odometry applications for real-time edge deployment on ARM-based embedded platforms.
        highlights:
          - "Optimized SLAM Sparse Bundle Adjustment algorithms for edge devices, improving computational efficiency and enabling real-time performance in resource-constrained environments"

      - company: COSIN Lab, INC Department, KMUTT
        position: FormulaStudent Vehicle Control Student Researcher
        location: Bangkok, Thailand
        start_date: 2023-11
        end_date: 2024-02
        summary: Developed ROS2-based autonomous navigation systems integrating IMU and camera sensor fusion for competitive robotics applications.
        highlights:
          - "Implemented the micro-ROS framework on microcontrollers for real-time IMU data acquisition and sensor synchronization, achieving sub-10ms latency for control loop feedback"
          - "Performed sensor calibration including IMU bias estimation and camera extrinsic alignment to improve localization accuracy in dynamic environments"

