cv:
  name: Htet Myat Aung (Alexander E. Hong)
  label: Incoming Master's Student (Mechanical Engineering), National Chung Cheng University | Machine Learning Researcher | Computer Vision & Robotics
  email: htetmyataung.ctla@gmail.com
  location: Chiayi, Taiwan
  image: ""
  url: https://orcid.org/0009-0004-7913-928X
  summary: Incoming Master of Mechanical Engineering (Automation & Control) at National Chung Cheng University on a fully funded scholarship, and a Machine Learning Researcher with hands-on experience across computer vision, 3D deep learning, SLAM, and data-pipeline engineering. First author of the Best Paper Award-winning study at IEEE ICoICT 2025, which introduced an optimised 3D-CNN reaching 99.75% accuracy in real-time infrared gas-leak classification, and co-author of a Q1 (Web of Science) journal paper on motion-induced eddy current testing for high-speed railway inspection. Proficient in Python and C/C++ for perception applications, with practical experience in camera calibration, sensor integration, ROS2-based autonomous navigation, and model optimisation for resource-constrained environments. Focused on perception, robotic autonomy, and ML-driven automation.

